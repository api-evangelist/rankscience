description: 'RankScience is a San Francisco based SEO and AI-visibility agency (RankScience
  LLC) that helps startups, SaaS companies, and enterprises grow search traffic through
  foundational and technical SEO, strategic content, and link building, alongside next-generation
  AI-search optimization services (Generative Engine Optimization, Large Language Model
  Optimization, and Answer Engine Optimization) for platforms like ChatGPT, Claude,
  and Perplexity. It began as a YC-backed SEO A/B testing platform and now operates
  as a services agency. RankScience does not currently publish a public developer API,
  SDKs, or API documentation; this profile captures its public web and AI-discovery
  surface (a published /llms.txt and domain security posture).'
